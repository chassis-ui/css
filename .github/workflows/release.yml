name: Release

# On a push to main, publishes the version in packages/css/package.json when npm does not have
# it yet, then creates its GitHub release from its CHANGELOG entry, with the zip of dist/
# attached. The version and the CHANGELOG are made on develop with Changesets. See "Releases"
# in .github/CONTRIBUTING.md.
#
# The checks of ci.yml ran on this commit when it was pushed to develop, and the ruleset of
# main requires them before the commit can reach main. This workflow does not run them again.
# It reads their results and stops unless each one passed.
#
# npm trusted publishing: the package trusts this workflow file of chassis-ui/css, so no npm
# token is needed, and every version has provenance. Renaming this file breaks publishing
# until the trusted publisher on npmjs.com is updated to match.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be publishing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    # A manual run on another branch stops here
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.npm.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prerelease such as 0.6.0-beta.1 goes to the dist-tag `beta`, and a version without a
      # prerelease part to `latest`. A numeric prerelease such as 0.6.0-0 goes to `next`,
      # because npm rejects a dist-tag that is a version range.
      - name: Read the version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/css/package.json').version")
          PRERELEASE=${VERSION#*-}

          if [ "$PRERELEASE" = "$VERSION" ]; then
            DIST_TAG=latest
          else
            DIST_TAG=${PRERELEASE%%.*}
            case "$DIST_TAG" in
              '' | *[!0-9A-Za-z-]* | [0-9]*) DIST_TAG=next ;;
            esac
          fi

          {
            echo "version=$VERSION"
            echo "dist-tag=$DIST_TAG"
            echo "prerelease=$([ "$DIST_TAG" = latest ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, dist-tag $DIST_TAG"

      # Compared with npm, not with the git history: a push can hold several commits, and
      # the version bump is not always in the last one
      - name: Check whether npm has the version
        id: npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@chassis-ui/css@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "npm has $VERSION. Nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "npm does not have $VERSION. It will be published."
          fi

  checks:
    name: Checks Passed
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      # The jobs of ci.yml that run on every push to develop. Dist is the comparison of the
      # committed dist/ and js/dist/ with a fresh build, which is what `npm publish` ships
      - name: Read the results of CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: |
            Dist (Node 22)
            Dist (Node 24)
            CSS
            JS
            Site
            Bundle Size
        run: |
          RESULTS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name')
          MISSING=0

          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue

            if printf '%s\n' "$RESULTS" | grep -qxF "$NAME"; then
              echo "passed: $NAME"
            else
              echo "::error::The check '$NAME' has not passed on $GITHUB_SHA"
              MISSING=1
            fi
          done <<< "$REQUIRED"

          exit $MISSING

  publish:
    name: Publish @chassis-ui/css
    needs: [detect, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the GitHub release and its tag
      id-token: write # for npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node.js 24 ships npm 11, which trusted publishing needs (11.5.1 or later). No cache:
      # this job installs nothing, and setup-node would otherwise look for pnpm, because the
      # root package.json names it in `packageManager`.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Before publishing, so a version without a CHANGELOG entry is not published
      - name: Release notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: node build/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      # packages/css/dist/ as chassis-css-<version>-dist.zip, the download that
      # packages/site/config.yml links to. What `pnpm release:zip` does, without an install,
      # and outside the package directory
      - name: Zip dist/
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          NAME="chassis-css-$VERSION-dist"
          cp -r packages/css/dist "$RUNNER_TEMP/$NAME"
          cd "$RUNNER_TEMP"
          zip -qr9 "$NAME.zip" "$NAME"

      - name: Publish to npm
        working-directory: packages/css
        env:
          DIST_TAG: ${{ needs.detect.outputs.dist-tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      # Runs only when the publish step succeeded
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi

          gh release create "v$VERSION" \
            "$RUNNER_TEMP/chassis-css-$VERSION-dist.zip" \
            --target "$GITHUB_SHA" \
            --title "@chassis-ui/css v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"
