name: CSS Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CSS Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint Sass
        run: pnpm css:lint

      - name: Build CSS
        run: pnpm css

      # `npm publish` ships dist/ as committed, with no build step of its own.
      # Source maps are left out: they embed the Sass sources, not output.
      - name: Check committed dist is up to date
        run: git diff --exit-code -- dist/css dist/tailwind ':!*.map'

      - name: Run Sass unit tests
        run: pnpm css:test

      - name: Run Tailwind build tests
        run: pnpm css:test:tailwind

      - name: Run Tailwind parity tests
        run: pnpm js:test:e2e:tailwind-parity
