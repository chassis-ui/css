name: CI

# Pull requests and pushes to develop run this workflow directly. Pushes to main run it through
# publish-release.yml, which publishes only after these jobs pass.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `npm publish` ships dist/ and js/dist/ of packages/css as committed, with no build step of
  # its own. This job builds them on every Node.js version the package supports and fails when
  # the result differs from what is committed.
  dist:
    name: Dist (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The package and the root's lint tools, not the site: the build must not depend on
      # the site's packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/css

      # Builds the CSS, the Tailwind entry, the JavaScript and its type declarations, then
      # compares dist/css, dist/tailwind, dist/js and js/dist of packages/css with the commit
      - name: Build and verify dist/
        run: pnpm verify

  css:
    name: CSS
    # Not ubuntu-latest: `playwright install --with-deps` installs system packages for the
    # Ubuntu releases its Playwright version knows. Move to a newer release together with a
    # Playwright version that supports it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The package and the root's lint tools, not the site: the build must not depend on
      # the site's packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/css

      # For the Tailwind parity tests
      - name: Install Playwright browsers
        run: pnpm --filter @chassis-ui/css exec playwright install --with-deps chromium

      - name: Lint Sass
        run: pnpm css:lint

      # The tests below read dist/, so they must see a build of this commit's source
      - name: Build CSS
        run: pnpm css

      - name: Run Sass unit tests
        run: pnpm css:test

      - name: Run Tailwind build tests
        run: pnpm css:test:tailwind

      - name: Run Tailwind parity tests
        run: pnpm js:test:e2e:tailwind-parity

  js:
    name: JS
    # Not ubuntu-latest: `playwright install --with-deps` installs system packages for the
    # Ubuntu releases its Playwright version knows. Move to a newer release together with a
    # Playwright version that supports it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The package and the root's lint tools, not the site: the build must not depend on
      # the site's packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/css

      - name: Install Playwright browsers
        run: pnpm --filter @chassis-ui/css exec playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: pnpm js:lint

      - name: Type check
        run: pnpm js:typecheck

      # The e2e and integration tests read dist/, so they must see a build of this commit's source
      - name: Build dist
        run: pnpm dist

      - name: Run unit tests (chromium, firefox, webkit)
        run: pnpm js:test:unit

      - name: Run e2e tests
        run: pnpm js:test:e2e

      # Two bundles of the JavaScript, and the package as a project installs it: what each
      # import resolves to, and its types in a strict TypeScript project
      - name: Run integration checks
        run: pnpm js:test:integration

      # publint and Are the types wrong? on the packed package
      - name: Check the package
        run: pnpm check:package

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check:astro

      # The same build as Vercel: syncs and builds vendor/assets, then Astro and Pagefind
      - name: Build
        run: pnpm site:build

      # After the build: the HTML validation and the link check read _site/
      - name: Lint
        run: pnpm site:lint

      # README, AGENTS.md and the other Markdown files, external URLs included
      - name: Markdown links
        run: pnpm docs:links

  # The sizes of the committed dist/ files against the budgets of
  # packages/css/.bundlewatch.config.json
  bundle:
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The package and the root's lint tools, not the site: the build must not depend on
      # the site's packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/css

      # The budgets are the sizes of 2026-09-28 plus about 5 percent. When a change outgrows one
      # on purpose, `pnpm bundlewatch:fix` raises it to the new size
      - name: Check bundle sizes
        run: pnpm check:bundle

  # A change to scss/, js/src/, postcss/, dist/ or js/dist/ of packages/css needs a changeset
  # (changedFilePatterns in .changeset/config.json, which are relative to the package);
  # `pnpm changeset --empty` adds one that releases nothing. A pull
  # request is compared with its base branch, a push to develop with the tip it replaced. The
  # Version Packages pull request consumes changesets, and so does the version commit when it
  # comes back from main into develop, so both are skipped.
  changeset:
    name: Changeset
    if: >-
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares with an earlier commit
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter chassis-css-workspace

      - name: Check for a changeset
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No earlier commit to compare with"
              exit 0
            fi

            # A commit from before the workspace layout has the package in the root
            PACKAGE_JSON=packages/css/package.json
            if ! git cat-file -e "$BEFORE:$PACKAGE_JSON" 2>/dev/null; then
              PACKAGE_JSON=package.json
            fi

            OLD_VERSION=$(git show "$BEFORE:$PACKAGE_JSON" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            NEW_VERSION=$(node -p 'require("./packages/css/package.json").version')
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "The push changes the version ($OLD_VERSION → $NEW_VERSION): a version step, which consumes changesets"
              exit 0
            fi

            SINCE="$BEFORE"
          fi

          pnpm changeset status --since "$SINCE"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # The audit installs nothing: the automatic cache of setup-node finds no pnpm
          # store to save, and its post step fails the job
          package-manager-cache: false

      # Blocking: a dependency that is installed with @chassis-ui/css reaches every project
      # that uses it. The package has none today, so this guards the day one is added. The
      # audit reads the lockfile of the whole workspace, so a runtime dependency of the site
      # would block too; the site has only development dependencies
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the build, test and site tooling never ships in the package
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true
