name: CI

# Pull requests and pushes to develop run this workflow directly. Pushes to main run it through
# publish-release.yml, which publishes only after these jobs pass.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `npm publish` ships dist/ and js/dist/ as committed, with no build step of its own. This job
  # builds them on every Node.js version the package supports and fails when the result differs
  # from what is committed.
  dist:
    name: Dist (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the CSS, the Tailwind entry, the JavaScript and its type declarations, then
      # compares dist/css, dist/tailwind, dist/js and js/dist with the commit
      - name: Build and verify dist/
        run: pnpm verify

  css:
    name: CSS
    # Not ubuntu-latest: `playwright install --with-deps` installs system packages for the
    # Ubuntu releases its Playwright version knows. Move to a newer release together with a
    # Playwright version that supports it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # For the Tailwind parity tests
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint Sass
        run: pnpm css:lint

      # The tests below read dist/, so they must see a build of this commit's source
      - name: Build CSS
        run: pnpm css

      - name: Run Sass unit tests
        run: pnpm css:test

      - name: Run Tailwind build tests
        run: pnpm css:test:tailwind

      - name: Run Tailwind parity tests
        run: pnpm js:test:e2e:tailwind-parity

  js:
    name: JS
    # Not ubuntu-latest: `playwright install --with-deps` installs system packages for the
    # Ubuntu releases its Playwright version knows. Move to a newer release together with a
    # Playwright version that supports it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: pnpm js:lint

      - name: Type check
        run: pnpm js:typecheck

      # The e2e and integration tests read dist/, so they must see a build of this commit's source
      - name: Build dist
        run: pnpm dist

      - name: Run unit tests (chromium, firefox, webkit)
        run: pnpm js:test:unit

      - name: Run e2e tests
        run: pnpm js:test:e2e

      - name: Run integration bundle checks
        run: pnpm js:test:integration

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check:astro

      # The same build as Vercel: syncs and builds vendor/assets, then Astro and Pagefind
      - name: Build
        run: pnpm site:build

      # After the build: the HTML validation reads _site/
      - name: Lint
        run: pnpm site:lint

  # The sizes of the committed dist/ files against the budgets of .bundlewatch.config.json
  bundle:
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reports only, for now: 7 of the 12 budgets are lower than the files they measure.
      # Remove continue-on-error once the budgets are set from the current sizes.
      - name: Check bundle sizes
        run: pnpm check:bundle
        continue-on-error: true

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # The audit installs nothing: the automatic cache of setup-node finds no pnpm
          # store to save, and its post step fails the job
          package-manager-cache: false

      # Blocking: a dependency that is installed with @chassis-ui/css reaches every project
      # that uses it. The package has none today, so this guards the day one is added
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the build, test and site tooling never ships in the package
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true
