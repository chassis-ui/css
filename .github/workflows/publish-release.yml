name: Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      css-changed: ${{ steps.changes.outputs.css-changed }}
      css-version: ${{ steps.version.outputs.css-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "css-version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already published on npm
        id: changes
        run: |
          # Compare against what's actually published on npm rather than
          # diffing git history — a push can bundle multiple commits, and
          # the version bump isn't always in the tip commit, so a
          # HEAD~1-vs-HEAD diff can miss it.
          VERSION="${{ steps.version.outputs.css-version }}"
          if npm view "@chassis-ui/css@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "Version $VERSION already on npm, skipping publish"
            echo "css-changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not on npm, will publish"
            echo "css-changed=true" >> $GITHUB_OUTPUT
          fi

  publish-css:
    needs: detect-changes
    if: needs.detect-changes.outputs.css-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Check if version already published on npm
        id: npm-check
        run: |
          VERSION="${{ needs.detect-changes.outputs.css-version }}"
          if npm view "@chassis-ui/css@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "already-published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already on npm, skipping publish"
          else
            echo "already-published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not on npm, will publish"
          fi

      - name: Publish @chassis-ui/css
        if: steps.npm-check.outputs.already-published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CHASSIS_UI }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.detect-changes.outputs.css-version }}"
          name: "@chassis-ui/css v${{ needs.detect-changes.outputs.css-version }}"
          body: |
            Published @chassis-ui/css v${{ needs.detect-changes.outputs.css-version }} to npm.

            Install with:
            ```bash
            npm install @chassis-ui/css@${{ needs.detect-changes.outputs.css-version }}
            ```
          draft: false
          prerelease: false
