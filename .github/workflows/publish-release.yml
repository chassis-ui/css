name: Publish Release

# On a push to main, after the checks of ci.yml pass on that commit: when the version in
# package.json is not on npm yet, publish it with npm trusted publishing (no npm token) and
# provenance, then create the GitHub release and its tag from the version's CHANGELOG entry.
# A prerelease version (0.6.0-beta.1) gets the npm dist-tag of its identifier, never `latest`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be publishing
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  # The checks of ci.yml; nothing is published unless they pass on this commit
  ci:
    uses: ./.github/workflows/ci.yml

  detect-changes:
    needs: ci
    # A manual run on another branch checks it and stops here
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      css-changed: ${{ steps.npm-check.outputs.css-changed }}
      css-version: ${{ steps.version.outputs.css-version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dist-tag of a prerelease is its first identifier when that is a word (`beta` of
      # 0.6.0-beta.1), and `next` when it is a number (0.6.0-0)
      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "css-version=$VERSION" >> "$GITHUB_OUTPUT"

          # Without the build metadata (`+…`), which may hold a hyphen of its own
          case "${VERSION%%+*}" in
            *-*)
              IDENTIFIER="${VERSION#*-}"
              IDENTIFIER="${IDENTIFIER%%[.+]*}"
              if [[ "$IDENTIFIER" =~ ^[a-z]+$ ]]; then
                DIST_TAG="$IDENTIFIER"
              else
                DIST_TAG=next
              fi
              PRERELEASE=true
              ;;
            *)
              DIST_TAG=latest
              PRERELEASE=false
              ;;
          esac

          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, dist-tag $DIST_TAG"

      # Compared with npm, not with the git history: a push can hold several commits, and
      # the version bump is not always in the last one
      - name: Check if version already published on npm
        id: npm-check
        env:
          VERSION: ${{ steps.version.outputs.css-version }}
        run: |
          if npm view "@chassis-ui/css@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "css-changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm, skipping publish"
          else
            echo "css-changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on npm, will publish"
          fi

  publish-css:
    needs: detect-changes
    if: needs.detect-changes.outputs.css-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release and its tag
      id-token: write # for npm trusted publishing and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node.js 24 ships npm 11, which trusted publishing needs (11.5.1 or later)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when the committed dist/ or js/dist/ differs from a fresh build of the source
      - name: Verify dist/
        run: pnpm verify

      # Before publishing, so a version without a CHANGELOG entry is not published
      - name: Release notes
        env:
          VERSION: ${{ needs.detect-changes.outputs.css-version }}
        run: node build/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish @chassis-ui/css
        env:
          DIST_TAG: ${{ needs.detect-changes.outputs.dist-tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: 'v${{ needs.detect-changes.outputs.css-version }}'
          name: '@chassis-ui/css v${{ needs.detect-changes.outputs.css-version }}'
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ needs.detect-changes.outputs.prerelease == 'true' }}
